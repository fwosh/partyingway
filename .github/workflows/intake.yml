name: Art party intake

on:
  schedule:
    # Every 20 minutes. Submissions only need queueing well before the party.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print rows instead of adding them to the sheet"
        type: boolean
        default: true
      lookback_hours:
        description: "How far back to scan mentions"
        type: string
        default: "48"

permissions:
  contents: read

concurrency:
  group: art-party-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan mentions and queue submissions
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
        run: python intake.py
