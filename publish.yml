name: Publish approved art parties

on:
  schedule:
    # Every 10 minutes, so a tick turns into a repost reasonably quickly.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would publish, without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: art-party-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish ticked rows
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          # 'calendar' writes the event directly. Switch to 'sheet' to keep
          # IFTTT in charge during a migration (needs RESPONSES_SHEET_ID).
          PUBLISH_MODE: calendar
          DRY_RUN: ${{ inputs.dry_run }}
        run: python publish.py
